name: Build, Test, and Deploy ZeeFlix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format and Lint (Rust)
        run: |
          # Surface the actual diagnostics in the check annotation: the runner
          # log is not readable from every client, but annotations always are.
          report() { grep -E "^(error|warning: unused)" -A6 "$1" | head -n 60 | sed -E "s/^/::error::/" || true; }
          if ! cargo fmt --check > /tmp/fmt.log 2>&1; then
            # rustfmt prints a diff, not "error:" lines, so annotate it verbatim.
            head -n 200 /tmp/fmt.log | sed -E "s/^/::error::/"
            exit 1
          fi
          if ! cargo clippy --all-targets --locked -- -D warnings > /tmp/clippy.log 2>&1; then
            grep -vE "^(\s+(Checking|Compiling|Finished))" /tmp/clippy.log | head -n 120 | sed -E "s/^/::error::/"
            echo "::error::clippy failed"
            exit 1
          fi

      - name: Run Rust Unit and Integration Tests
        run: |
          if ! cargo test --locked > /tmp/test.log 2>&1; then
            grep -E "^(error|failures:|---- )" -A8 /tmp/test.log | head -n 150 | sed -E "s/^/::error::/" || true
            exit 1
          fi

      - name: Install Node Dependencies and Test Web Modules
        run: |
          npm ci --ignore-scripts
          npm run test:web

      - name: Resolve the public base URL
        id: base
        run: |
          # A custom domain wins; otherwise Pages serves the repo subpath. The
          # value flows into canonical links, Open Graph tags and the sitemap.
          PAGES_URL="${{ vars.ZEEFLIX_BASE_URL }}"
          if [ -z "$PAGES_URL" ]; then
            if [ -f public/CNAME ]; then
              PAGES_URL="https://$(head -1 public/CNAME | tr -d '[:space:]')/"
            else
              PAGES_URL="${{ github.event.repository.html_url }}"
              PAGES_URL="${PAGES_URL%.git}"
              PAGES_URL="$(echo "$PAGES_URL" | sed -E 's#https://github.com/([^/]+)/([^/]+)#https://\1.github.io/\2/#')"
            fi
          fi
          echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"
          echo "public base: $PAGES_URL"

      - name: Build Production Static Site
        env:
          ZEEFLIX_BASE_URL: ${{ steps.base.outputs.url }}
        run: npm run build

      - name: Verify the install page and marketing assets shipped
        run: |
          test -f dist/install.html
          test -f dist/install-qr.png
          test -f dist/screenshots/app-home.webp
          grep -q "ZeeFlix-latest.apk" dist/install.html
          # Crawlable surface: a sitemap, a robots file, and one document per title.
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/title/sintel.html
          test "$(ls dist/title | wc -l)" -ge 10
          grep -q "og:image" dist/index.html
          grep -q "application/ld+json" dist/index.html
          grep -q "canonical" dist/title/sintel.html
          ! grep -rq "{{" dist/index.html dist/title/sintel.html
          echo "install + crawl surface OK"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Android Unit Tests, Lint, and Build APK
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload ZeeFlix Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeeFlix-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Versioned releases are published only by publish-assets.yml.

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
