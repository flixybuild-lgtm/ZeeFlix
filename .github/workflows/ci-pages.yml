name: Build, Test, and Deploy ZeeFlix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format and Lint (Rust)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust Unit and Integration Tests
        run: cargo test --locked

      - name: Install Node Dependencies and Test Web Modules
        run: |
          npm ci --ignore-scripts
          npm run test:web

      - name: Build Production Static Site
        run: npm run build

      - name: Verify the install page and marketing assets shipped
        run: |
          test -f dist/install.html
          test -f dist/install-qr.png
          test -f dist/screenshots/app-home.webp
          grep -q "ZeeFlix-latest.apk" dist/install.html
          echo "install surface OK"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Android Unit Tests, Lint, and Build APK
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload ZeeFlix Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeeFlix-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Versioned releases are published only by publish-assets.yml.

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
