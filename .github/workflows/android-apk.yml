name: Build Framewave Android APK

on:
  workflow_dispatch:
    inputs:
      publish_download_branch:
        description: "Publish the APK to the ci-apk/latest download branch"
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android app dependencies
        working-directory: android-app
        run: npm ci

      - name: Generate the Expo Android project
        working-directory: android-app
        run: npm run build:sandbox && npx expo prebuild --platform android --clean --no-install

      - name: Run Android unit tests, lint and build the APK
        working-directory: android-app/android
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: always()
        working-directory: android-app/android
        run: |
          if [ -f gradle-build.log ] && [ "${{ job.status }}" = "failure" ]; then
            {
              echo '## Android Gradle failure (last 120 lines)'
              echo '```text'
              tail -n 120 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the APK (package, signature, alignment)
        run: |
          set -euo pipefail
          APK="android-app/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          BT="$(ls -1 "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|native-code)" badging.txt || true
          grep -q "package: name='com.zeeflix.app'" badging.txt
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c 4 "$APK"

      - name: Upload Framewave Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Framewave-Android-APK
          path: |
            android-app/android/app/build/outputs/apk/debug/app-debug.apk
            android-app/LICENSE
            android-app/NOTICE

      - name: Publish APK download branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_download_branch
        run: |
          set -euo pipefail
          BRANCH="ci-apk/latest"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk artifacts/Framewave-1.3.0-debug.apk
          git checkout -B "$BRANCH"
          git add artifacts/Framewave-1.3.0-debug.apk
          git commit -m "CI: publish Framewave 1.3.0 debug APK (run ${{ github.run_id }})"
          git push -f origin "HEAD:refs/heads/$BRANCH"
          echo "Published to https://github.com/${{ github.repository }}/raw/$BRANCH/artifacts/Framewave-1.3.0-debug.apk"
