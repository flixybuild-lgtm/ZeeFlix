name: Publish Framewave APK & Screenshots
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New version tag (must match the app version)'
        type: string
        required: true
        default: v1.3.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify version and build web app
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          cargo test --locked
          npm ci --ignore-scripts
          npm run build
      - name: Generate screenshots and marketing assets
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          npm run screenshots
          node -e "if(require('./test-results/screenshots-report.json').failed)process.exit(1)"
          pip install pillow fonttools brotli
          npm run marketing
          npm run demo
          npm run test:web
      - name: Install Android app dependencies
        working-directory: android-app
        run: npm ci
      - name: Type-check, lint and test Framewave provider policy
        working-directory: android-app
        run: |
          npm run build:sandbox
          npx tsc --noEmit
          npm run lint
          npx jest __tests__/manifestProviderPath.test.ts __tests__/settingsStorage.test.ts --runInBand
      - name: Generate Expo Android project
        working-directory: android-app
        run: npx expo prebuild --platform android --clean --no-install
      - name: Test and assemble APK
        working-directory: android-app/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Publish verified build and captures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          APK=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.zeeflix.app'" apk-badging.txt
          grep -q "application-label:'Framewave'" apk-badging.txt
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c 4 "$APK"
          mkdir release
          cp "$APK" "release/Framewave-$TAG-debug.apk"
          cp "$APK" release/ZeeFlix-latest.apk
          cp android-app/LICENSE release/Framewave-Android-LICENSE.txt
          cp android-app/NOTICE release/Framewave-Android-NOTICE.txt
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots docs/marketing public/screenshots
          git diff --cached --quiet || git commit -m "Refresh Framewave screenshots for $TAG"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          gh release create "$TAG" release/* docs/screenshots/{home-desktop,provider-entry-mobile}.png --target "$(git rev-parse HEAD)" --title "Framewave $TAG — Android and web" --notes-file docs/RELEASE_NOTES_TEMPLATE.md --latest
