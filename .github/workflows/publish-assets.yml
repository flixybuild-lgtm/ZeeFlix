name: Publish ZeeFlix APK & Screenshots

# One button that produces everything a visitor needs:
#   • a signed debug APK attached to a GitHub Release (stable "latest" download URL)
#   • a fresh set of real, device-accurate screenshots
#   • the README/store marketing images rendered from those screenshots
# Screenshots are also pushed to the `ci-artifacts/latest` branch so a maintainer
# can commit the approved set without downloading workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or refresh"
        type: string
        default: "v1.0.0"
      publish_screenshots_branch:
        description: "Push screenshots to the ci-artifacts/latest branch"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      # Screenshots are a nice-to-have; the APK and release are the deliverable.
      # Each step below is therefore best-effort with an explicit log message.
      - name: Install Chromium for screenshots
        id: chromium
        continue-on-error: true
        run: |
          set -x
          npx playwright --version
          sudo npx playwright install-deps chromium
          npx playwright install chromium
          npx playwright install --list

      - name: Build the production web app
        run: npm run build

      - name: Capture real screenshots
        id: screenshots
        continue-on-error: true
        run: node scripts/screenshots.mjs

      - name: Render marketing images from the screenshots
        if: steps.screenshots.outcome == 'success'
        continue-on-error: true
        run: python3 -m pip install --quiet pillow fonttools brotli && python3 scripts/make_marketing.py

      - name: Build the Android APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" release/ZeeFlix-${{ inputs.release_tag }}-debug.apk
          cp "$APK" release/ZeeFlix-latest.apk
          ( cd release && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -lh release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          BODY=$(cat docs/RELEASE_NOTES_TEMPLATE.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ZeeFlix $TAG — Android APK + Web" --notes "$BODY"
          else
            gh release create "$TAG" --title "ZeeFlix $TAG — Android APK + Web" --notes "$BODY" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt --clobber

      - name: Push screenshots to the artifacts branch
        if: inputs.publish_screenshots_branch && steps.screenshots.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-artifacts/latest
          git add -f docs/screenshots docs/marketing
          git commit -m "CI: refresh ZeeFlix screenshots and marketing images (run ${{ github.run_id }})" || echo "no changes"
          git push -f origin HEAD:refs/heads/ci-artifacts/latest
